name: P20 WhatsApp One-Shot Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  p20-validation:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: smoke-test-only
      JWT_SECRET_KEY: smoke-test-jwt-secret-012345678901234567890123
      DATABASE_URL: sqlite:///partnershub_p20_smoke.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Migration graph
        run: |
          alembic heads
          alembic history --verbose | head -n 120

      - name: Fresh migration
        run: |
          rm -f partnershub_p20_smoke.db
          alembic upgrade head

      - name: Verify current head and P20 tables
        run: |
          python - <<'PY'
          import sqlite3

          conn = sqlite3.connect("partnershub_p20_smoke.db")
          tables = {
              r[0]
              for r in conn.execute(
                  "select name from sqlite_master where type='table'"
              )
          }

          required = {
              "whatsapp_sessions",
              "whatsapp_events",
              "whatsapp_quote_intents",
          }
          missing = sorted(required - tables)
          assert not missing, missing

          version = conn.execute(
              "select version_num from alembic_version"
          ).fetchall()
          assert version == [("0015_p20_whatsapp_one_shot",)], version

          print("P20 schema: PASS")
          conn.close()
          PY

      - name: P20 import and behavior smoke
        run: python scripts/verify_p20_whatsapp.py

      - name: Gunicorn startup
        run: |
          timeout 15s gunicorn --bind 127.0.0.1:8110 p0_runtime:app >/tmp/p20-gunicorn.log 2>&1 &
          pid=$!
          sleep 5
          kill -0 "$pid"
          curl --fail --silent --show-error http://127.0.0.1:8110/api/p20/whatsapp/health
          echo
          kill "$pid" || true
          cat /tmp/p20-gunicorn.log
