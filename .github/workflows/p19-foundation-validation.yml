name: P19 Foundation Validation

on:
  push:
    branches:
      - main
      - agent/p19-fix-p11-import
      - agent/p19-knowledge-base
  pull_request:
    branches:
      - main
      - agent/p19-knowledge-base
  workflow_dispatch:

jobs:
  foundation-validation:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: smoke-test-only
      JWT_SECRET_KEY: smoke-test-jwt-secret-012345678901234567890123
      DATABASE_URL: sqlite:///partnershub_p19_foundation.db
      OPENAI_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      AI_PROVIDER: openai
      AI_FALLBACK_PROVIDER: deepseek
      P13_IMPORT_MAX_BYTES: "10485760"
      P13_IMPORT_MAX_ROWS: "10000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Python import and route validation
        run: |
          python - <<'PY'
          import p0_runtime
          app = p0_runtime.app
          rules = {r.rule for r in app.url_map.iter_rules()}
          required = (
              "/api/p17",
              "/api/p18",
              "/api/p19/health",
              "/api/p19/search",
              "/api/p13/operational/import-file",
              "/api/p13/operational/import-policy",
              "/api/p20/whatsapp/health",
          )
          for route in required:
              assert any(r == route or r.startswith(route + "/") for r in rules), route
          print("P0-P20 import and route registration: PASS")
          PY

      - name: Gunicorn startup validation
        run: |
          timeout 15s gunicorn --bind 127.0.0.1:8099 p0_runtime:app >/tmp/gunicorn.log 2>&1 &
          pid=$!
          sleep 5
          kill -0 "$pid"
          echo "Gunicorn startup: PASS"
          kill "$pid" || true
          cat /tmp/gunicorn.log

      - name: Migration graph validation
        run: |
          alembic heads
          alembic history

      - name: Fresh database migration
        run: |
          rm -f partnershub_p19_foundation.db
          alembic upgrade head

      - name: P19 and operational database validation
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("partnershub_p19_foundation.db")
          names = {row[0] for row in conn.execute("select name from sqlite_master where type='table'")}
          required = {
              "knowledge_sources",
              "knowledge_entries",
              "operational_data_records",
              "whatsapp_sessions",
              "whatsapp_events",
              "whatsapp_quote_intents",
              "alembic_version",
          }
          missing = sorted(required - names)
          assert not missing, missing
          versions = [row[0] for row in conn.execute("select version_num from alembic_version")]
          assert versions == ["0015_p20_whatsapp_one_shot"], versions
          print("Fresh migration, P19 schema and P13/P20 schema: PASS")
          conn.close()
          PY

      - name: P19 foundation smoke verification
        run: python scripts/verify_p19_foundation.py

      - name: P20 WhatsApp one-shot smoke verification
        run: python scripts/verify_p20_whatsapp.py

      - name: Operational report file ingestion smoke verification
        run: python scripts/verify_operational_file_ingest.py

      - name: Production foundation runtime certification
        run: |
          set -euo pipefail
          export DATABASE_URL="sqlite:///$GITHUB_WORKSPACE/partnershub_p19_foundation.db"
          gunicorn --bind 127.0.0.1:8100 --workers 1 --threads 2 --timeout 60 p0_runtime:app >/tmp/production-foundation.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 5
          kill -0 "$pid"
          curl --fail --silent --show-error http://127.0.0.1:8100/api/p19/health
          echo
          curl --fail --silent --show-error "http://127.0.0.1:8100/api/p19/search?q=test"
          echo
          curl --fail --silent --show-error http://127.0.0.1:8100/api/p20/whatsapp/health
          echo
          echo "PRODUCTION FOUNDATION: PASS"
          cat /tmp/production-foundation.log
