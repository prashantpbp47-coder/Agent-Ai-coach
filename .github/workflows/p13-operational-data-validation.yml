name: P13 Operational Data Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  operational-data-validation:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
      SECRET_KEY: smoke-test-only
      JWT_SECRET_KEY: smoke-test-jwt-secret-012345678901234567890123
      DATABASE_URL: sqlite:///partnershub_p13_ingest.db
      P13_IMPORT_MAX_BYTES: "10485760"
      P13_IMPORT_MAX_ROWS: "10000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Import and route validation
        run: python -c "import p0_runtime; routes={r.rule for r in p0_runtime.app.url_map.iter_rules()}; required={'/api/p13/operational/import-file','/api/p13/operational/import-policy'}; assert required <= routes, sorted(required-routes); print('P13 file routes: PASS')"
      - name: Fresh database migration
        run: |
          rm -f partnershub_p13_ingest.db
          alembic upgrade head
      - name: Verify current migration head and operational table
        run: |
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("partnershub_p13_ingest.db")
          version = conn.execute("select version_num from alembic_version").fetchall()
          assert version == [("0015_p20_whatsapp_one_shot",)], version
          tables = {r[0] for r in conn.execute("select name from sqlite_master where type='table'")}
          assert "operational_data_records" in tables, sorted(tables)
          print("Operational schema: PASS")
          conn.close()
          PY
      - name: Secure operational CSV ingestion smoke
        run: python scripts/verify_operational_file_ingest.py
      - name: Gunicorn startup
        run: |
          timeout 15s gunicorn --bind 127.0.0.1:8120 p0_runtime:app >/tmp/p13-gunicorn.log 2>&1 &
          pid=$!
          sleep 5
          kill -0 "$pid"
          curl --fail --silent --show-error http://127.0.0.1:8120/api/p19/health
          echo
          kill "$pid" || true
          cat /tmp/p13-gunicorn.log
